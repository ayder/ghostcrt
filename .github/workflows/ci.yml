name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.10'
          python-version: ${{ matrix.python }}
      # Every check lives in pyproject.toml [tool.ghostcrt.checks]; the local
      # gate runs the same table. tests/test_ci_drift.py guards this file.
      - run: uv run --no-project python scripts/checks.py --os ${{ matrix.os }} --python ${{ matrix.python }}
