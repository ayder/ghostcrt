[project]
name = "ghostcrt"
version = "0.3.0"
description = "Terminal UI for managing multiple SSH sessions with an encrypted password vault"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "textual==8.2.8",
  "ghostty-textual @ https://github.com/ayder/ghostty-textual/releases/download/v0.0.2/ghostty_textual-0.0.2-py3-none-any.whl",
  "cryptography>=50.0.0",
  "argon2-cffi>=23.1.0",
  "sshconf>=0.2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
ghostcrt = "ghostcrt.__main__:main"

[project.urls]
Repository = "https://github.com/ayder/ghostcrt"
Issues = "https://github.com/ayder/ghostcrt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostcrt"]

[tool.hatch.build]
exclude = ["/.ayder"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "BLE001",  # broad except used for UI/process resilience
  "S110",    # try/except pass for best-effort UI cleanup
  "ASYNC222",  # WNOHANG waitpid in async poll loop
]
